name: Desplegar Sitio Web ICAP a GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar sitio estático para GitHub Pages
        run: |
          mkdir -p _site
          cp -r assets _site/assets
          cp -r maqueta-html/* _site/
          # Normalizar las rutas de ../assets hacia assets/
          sed -i 's|\.\./assets/|assets/|g' _site/*.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Desplegar en vivo
        id: deployment
        uses: actions/deploy-pages@v4
